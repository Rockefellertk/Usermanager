{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Plan" %}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h4>{% trans "Plan" %}</h4>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">{% trans "Save" %}</button>
      <a href="{% url 'plans:list' %}" class="btn btn-outline-secondary">{% trans "Cancel" %}</a>
    </form>
  </div>
</div>
{% endblock %}

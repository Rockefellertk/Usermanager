{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Delete Plan" %}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger">
      <div class="card-body">
        <h5>{% blocktrans with name=object.name %}Delete plan "{{ name }}"?{% endblocktrans %}</h5>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">{% trans "Delete" %}</button>
          <a href="{% url 'plans:list' %}" class="btn btn-outline-secondary">{% trans "Cancel" %}</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

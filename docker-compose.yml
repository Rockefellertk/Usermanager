services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: usermanager
      POSTGRES_USER: usermanager_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application -c deploy/gunicorn.conf.py"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://usermanager_app:${DB_PASSWORD}@db:5432/usermanager
    depends_on: [db, redis]
    volumes:
      - static:/app/staticfiles
    restart: unless-stopped

  worker:
    build: .
    command: celery -A config worker -l info --concurrency=4
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://usermanager_app:${DB_PASSWORD}@db:5432/usermanager
    depends_on: [db, redis]
    restart: unless-stopped

  beat:
    build: .
    command: celery -A config beat -l info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://usermanager_app:${DB_PASSWORD}@db:5432/usermanager
    depends_on: [db, redis]
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/staticfiles:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [web]
    restart: unless-stopped

volumes:
  pgdata:
  static:
